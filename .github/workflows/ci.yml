name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11" # the oldest supported (requires-python)
          enable-cache: true
      # Node runs the overlay tests (built-in WebSocket needs >= 22) and installs the claude CLI,
      # which test_plugin_layout uses for `claude plugin validate`. Chrome ships with the runners.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      # Media tests run on macOS only: apt on the Ubuntu runners can hang, and there they skip.
      # librsvg's rsvg-convert burns subtitles since Homebrew's ffmpeg has no libass.
      - if: runner.os == 'macOS'
        run: brew install ffmpeg librsvg
      - run: uv run pytest -ra

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments '**/*.md'
